<!DOCTYPE html>
<html>
<head>
<title>PTM HSS Thrikkaderi</title>

<style>
body{
    font-family: Arial;
    background:#eef2f5;
    display:flex;
    justify-content:center;
}

.container{
    background:white;
    margin-top:30px;
    padding:25px;
    width:400px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

label{
    font-size:13px;
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input, select{
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    margin-top:5px;
    width:100%;
}

.phone-group{
    display:flex;
    gap:10px;
}

.code{
    width:90px;
}

.number{
    flex:1;
}

button{
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.submit-btn{
    background:#28a745;
    color:white;
    margin-top:15px;
}

.admin-btn{
    background:#007bff;
    color:white;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="container">

<h2>PTM HSS Thrikkaderi</h2>
<h3 style="text-align:center;">Admission Form</h3>

<p id="status"></p>

<form id="form" onsubmit="submitForm(event)">

<!-- STUDENT -->
<label>Student Name</label>
<input type="text" id="name" required>

<!-- PARENT -->
<label>Parent Name</label>
<input type="text" id="parent" required>

<!-- ADDRESS -->
<label>Address</label>
<input type="text" id="address" required>

<!-- SCHOOL -->
<label>Previous School</label>
<input type="text" id="school" required>

<!-- EMAIL -->
<label>Email ID</label>
<input type="email" id="email" required>

<!-- PHONE -->
<label>Phone Number</label>
<div class="phone-group">
    <select id="countryCode" class="code">
        <option value="+91">+91</option>
        <option value="+1">+1</option>
        <option value="+44">+44</option>
        <option value="+971">+971</option>
    </select>

    <input type="text" id="phone" class="number" maxlength="10" required>
</div>

<!-- WHATSAPP -->
<label>WhatsApp Number</label>
<div class="phone-group">
    <select id="whatsappCode" class="code">
        <option value="+91">+91</option>
        <option value="+1">+1</option>
        <option value="+44">+44</option>
        <option value="+971">+971</option>
    </select>

    <input type="text" id="whatsapp" class="number" maxlength="10" required>
</div>

<!-- COURSE -->
<label>Select Course</label>
<select id="course" required>
<option value="">Select Course</option>

<option>English Medium - Malayalam Language</option>
<option>English Medium - Sanskrit Language</option>
<option>English Medium - Arabic Language</option>
<option>English Medium - Urdu Language</option>

<option>Malayalam Medium - Malayalam Language</option>
<option>Malayalam Medium - Sanskrit Language</option>
<option>Malayalam Medium - Arabic Language</option>
<option>Malayalam Medium - Urdu Language</option>

</select>

<!-- INTEREST 1 -->
<label>Interest (Activity)</label>
<select id="interest1">
<option>Nothing</option>
<option>Little Kites</option>
<option>Scout and Guide</option>
<option>JRC</option>
</select>

<!-- INTEREST 2 -->
<label>Interest (Category)</label>
<select id="interest2">
<option>Nothing</option>
<option>Arts</option>
<option>Sports</option>
</select>

<button type="submit" class="submit-btn">Submit</button>

</form>

<button class="admin-btn" onclick="adminLogin()">🔐 Admin Login</button>

</div>

<script>

// ADMISSION STATUS
let admissionOpen = JSON.parse(localStorage.getItem("admissionOpen"));
if(admissionOpen === null) admissionOpen = true;

updateStatus();

function updateStatus(){
    document.getElementById("status").innerText =
        admissionOpen ? "✅ Admission Open" : "❌ Admission Closed";

    document.getElementById("form").style.display =
        admissionOpen ? "block" : "none";
}

// SUBMIT
function submitForm(e){
    e.preventDefault();

    if(!admissionOpen){
        alert("Admission Closed!");
        return;
    }

    let phone = document.getElementById("phone").value;
    let whatsapp = document.getElementById("whatsapp").value;
    let email = document.getElementById("email").value;

    // VALIDATION
    if(!/^[0-9]{10}$/.test(phone)){
        alert("Enter valid phone number");
        return;
    }

    if(!/^[0-9]{10}$/.test(whatsapp)){
        alert("Enter valid WhatsApp number");
        return;
    }

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        alert("Enter valid email");
        return;
    }

    // SAVE DATA
    let student = {
        name: document.getElementById("name").value,
        parent: document.getElementById("parent").value,
        address: document.getElementById("address").value,
        school: document.getElementById("school").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("countryCode").value + " " + phone,
        whatsapp: document.getElementById("whatsappCode").value + " " + whatsapp,
        course: document.getElementById("course").value,
        interest1: document.getElementById("interest1").value,
        interest2: document.getElementById("interest2").value
    };

    let students = JSON.parse(localStorage.getItem("students")) || [];
    students.push(student);

    localStorage.setItem("students", JSON.stringify(students));

    alert("✅ Submitted Successfully!");
    document.getElementById("form").reset();
}

// ADMIN LOGIN
function adminLogin(){
    let pass = prompt("Enter Admin Password:");
    if(pass === "rajesh123"){
        window.open("admin.html", "_blank");
    }else{
        alert("Wrong password");
    }
}

</script>

</body>
</html>
